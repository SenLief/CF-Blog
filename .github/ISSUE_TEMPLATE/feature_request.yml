name: 功能建议
description: 提议一个有明确使用场景的改进。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 当前遇到了什么问题，谁会受益？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为，以及对 UI、API、数据或部署的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 已经考虑过哪些替代方式？
